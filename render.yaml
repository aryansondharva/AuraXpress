services:
  # Backend API Service
  - type: web
    name: auraxpress-backend
    runtime: node
    region: singapore  # Change to your preferred region
    plan: free  # Change to 'starter' for production (no sleep)
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres:1046402103As@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=verify-full
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false  # Set after deploying frontend
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        value: aryansondharva25@gmail.com
      - key: EMAIL_PASSWORD
        value: jwjmkyjysdyjmglg
