services:
  # Backend API Service
  - type: web
    name: auraxpress-backend
    runtime: node
    region: singapore  # Change to your preferred region
    plan: free  # Change to 'starter' for production (no sleep)
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: db.xksgbckzekxuwfuwwyzj.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        value: 9913386244@As
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false  # Set after deploying frontend
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        value: 
      - key: EMAIL_PASSWORD
        value: 
